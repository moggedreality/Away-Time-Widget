# Version Catalog for Away Time
# Centralized dependency and plugin versions
# Update versions here, then run: ./gradlew dependencyUpdates

[versions]
# Build tools
agp = "8.13.2"
kotlin = "2.3.20"
gradle = "8.14.3"

# Android
compileSdk = 36
minSdk = 28
targetSdk = 36
jvmTarget = "17"

# Libraries (add as needed)
# androidx-core = "1.15.0"
# androidx-lifecycle = "2.8.7"
# kotlinx-coroutines = "1.10.0"
# kotlinx-serialization = "1.7.2"
# room = "2.6.1"
# datastore = "1.1.4"

# Testing
junit = "4.13.2"
junit-jupiter = "5.11.0"
androidx-test = "1.5.2"
androidx-test-runner = "1.5.2"
androidx-test-rules = "1.5.2"
espresso = "3.5.1"
truth = "1.1.7"
robolectric = "4.11"

# Code quality
ktlint = "1.5.0"
detekt = "1.23.6"
spotless = "6.25.0"

[libraries]
# AndroidX (uncomment as needed)
# androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidx-core" }
# androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "androidx-lifecycle" }
# androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "androidx-lifecycle" }
# androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "androidx-activity" }
# androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "androidx-fragment" }

# Coroutines
# kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
# kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }

# Serialization
# kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

# Room
# room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
# room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
# room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# DataStore
# datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
# datastore-preferences-rxjava3 = { group = "androidx.datastore", name = "datastore-preferences-rxjava3", version.ref = "datastore" }

# Testing
junit = { group = "junit", name = "junit", version.ref = "junit" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junit-jupiter" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidx-test" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidx-test-runner" }
androidx-test-rules = { group = "androidx.test", name = "rules", version.ref = "androidx-test-rules" }
androidx-test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
androidx-test-espresso-contrib = { group = "androidx.test.espresso", name = "espresso-contrib", version.ref = "espresso" }
truth = { group = "com.google.truth", name = "truth", version.ref = "truth" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }

[plugins]
# Android Gradle Plugin
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }

# Code quality
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }

# Utilities
version-catalog-update = { id = "com.github.ben-manes.versions", version = "0.53.0" }