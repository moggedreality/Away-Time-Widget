# Project-wide Gradle settings
# See: https://docs.gradle.org/current/userguide/build_environment.html

# JVM settings for Gradle daemon
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX (enabled by default in AGP 8+)
android.useAndroidX=true

# Kotlin code style (official)
kotlin.code.style=official

# Version catalog property for AGP version
# This is also defined in gradle/libs.versions.toml
agp.version=8.13.2

# Configuration cache (Gradle 8.14+)
org.gradle.unsafe.configuration-cache=true

# Parallel execution
org.gradle.parallel=true

# Caching
org.gradle.caching=true