# Dependabot Auto-Merge Configuration
# Add this as a GitHub Actions workflow: .github/workflows/dependabot-auto-merge.yml
# Automatically merges dependabot PRs for patch/minor updates that pass CI

name: Dependabot Auto-Merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Check if PR is from Dependabot
        if: github.actor == 'dependabot[bot]'
        run: echo "Dependabot PR detected"

      - name: Enable auto-merge for patch/minor updates
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pull-request-number: ${{ github.event.pull_request.number }}
          merge-method: squash
        if: |
          contains(github.event.pull_request.labels.*.name, 'dependencies') &&
          (contains(github.event.pull_request.title, 'patch') || contains(github.event.pull_request.title, 'minor'))